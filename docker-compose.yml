services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    user: ${PUID}:${PGID}
    restart: unless-stopped
    environment:
      - TZ=Europe/Dublin
      - JELLYFIN_PublishedServerUrl=http://${IP}
    volumes:
      - /media-server/jellyfin/config:/config
      - /media-server/jellyfin/cache:/cache
      - type: bind
        source: /mnt/torrents/completed/Movies
        target: /Movies
      - type: bind
        source: /mnt/torrents/completed/TV
        target: /TV
        read_only: true
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - /media-server/radarr/config:/config
      - /media-server/radarr/data:/data
      - /mnt/torrents:/mnt/torrents
    environment:
      - PUID=${PUID}
      - PGID=${PGID}

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - /media-server/sonarr/config:/config
      - /media-server/sonarr/data:/data
      - /mnt/torrents:/mnt/torrents
    environment:
      - PUID=${PUID}
      - PGID=${PGID}

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Dublin
      - AUTO_UPDATE=true
    volumes:
      - /media-server/jackett/config:/config
      - /mnt/torrents/completed:/downloads
    ports:
      - 9117:9117

  deluge:
    image: lscr.io/linuxserver/deluge
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Dublin
    volumes:
      - /media-server/deluge/config:/config
      - /media-server/deluge/data:/data
      - /mnt/torrents:/mnt/torrents
    ports:
      - 8112:8112
      - 6881:6881
      - 6881:6881/udp
